description = "Observability dashboard for OpenClaw multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "duckdb>=1.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=9.0.0"]
